name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python files
        run: python -m compileall -q tools
      - name: Unit tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Run documented sample
        run: python tools/score.py examples/sample_review.json
